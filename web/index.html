
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10141d">
    <title>DREAMEROL | FORK SYNC</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <main class="login-container">
        <div class="brand">
            <div class="brand-mark">D</div>
            <h1>DREAMEROL</h1>
            <p>GITHUB FORK SYNCHRONIZATION</p>
        </div>

        <section class="sync-panel">
            <h2>Connect & Sync</h2>
            <p class="subtitle">
                Synchronize your GitHub forks automatically.
            </p>

            <form id="sync-form">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="sync-button">
                    <span id="button-text">⟳ SYNC</span>
                </button>
            </form>

            <div id="sync-status" role="status" aria-live="polite">
                Ready to synchronize.
            </div>

            <div id="sync-results"></div>
        </section>

        <footer>
            DREAMEROL · FORK SYNC
        </footer>
    </main>
</body>
</html>
